<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマートフォンの縦横画面・レスポンシブ表示に対応するためのメタタグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>8th Wall Face Effects WebAR サンプル</title>

  <!-- 1. 8th Wall用に最適化されたA-Frame (8frame) の読み込み -->
  <script src="//cdn.8thwall.com/web/aframe/8frame-1.4.1.min.js"></script>

  <!-- 2. UI制御やフェイストラッキング補助用のXrExtrasライブラリ -->
  <script src="//cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 3. 8th Wall WebAR エンジン本体（顔認識モジュール対応） -->
  <!-- ※ 実際に公開・動作させる際は、appKey= にご自身の8th Wall APIキーを入力してください -->
  <script async src="//apps.8thwall.com/xrweb?appKey=YOUR_8THWALL_API_KEY"></script>

  <!-- スタイル定義：カメラ画面を全画面表示にする設定およびカメラ許可補助UIの追加 -->
  <style>
    body {
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background-color: #000;
    }

    /* 読み込み中やUIの調整用スタイル */
    .ar-instruction {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-family: sans-serif;
      z-index: 1000;
      pointer-events: none;
      transition: background 0.3s;
    }

    /* カメラのアクセス許可を明示的に促すためのオーバーレイ画面 */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 20, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-overlay h2 {
      margin: 0 0 12px 0;
      font-size: 22px;
    }

    #start-overlay p {
      font-size: 14px;
      color: #ccc;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 0 24px 0;
    }

    #start-button {
      background: linear-gradient(135deg, #7928CA, #FF0080);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 128, 0.4);
      outline: none;
      transition: transform 0.1s, opacity 0.2s;
    }

    #start-button:active {
      transform: scale(0.96);
    }

    /* HTTPS非対応時やエラー時の警告用 */
    .warning-text {
      color: #ff5252 !important;
      font-size: 13px !important;
      margin-top: 15px !important;
    }
  </style>
</head>
<body>

  <!-- 
    カメラ起動・アクセス許可用のユーザーインタラクション画面
    ※ブラウザ（特にiOS Safariや最新のChrome）は、ユーザーの直接タップ操作がないと
      カメラ許可ダイアログを表示しない制限があるため、明示的な開始ボタンを設置しています。
  -->
  <div id="start-overlay">
    <h2>カメラのアクセス許可</h2>
    <p>WebAR体験を開始するには、カメラへのアクセス許可が必要です。<br>下のボタンを押して許可してください。</p>
    <button id="start-button">ARカメラを開始する</button>
    <p id="env-warning" class="warning-text" style="display: none;"></p>
  </div>

  <!-- 画面上のガイダンス表示 -->
  <div class="ar-instruction">ARを準備中...</div>

  <!-- A-Frame シーン定義 -->
  <!-- 
    xrface: 8th Wallの顔認識（Face Tracking）機能を有効化
    xrextras-loading: ロード中の画面を表示
    xrextras-runtime-error: エラー時のメッセージ表示
  -->
  <a-scene
    xrface
    xrextras-loading
    xrextras-runtime-error>

    <!-- アセット管理エリア：3Dモデルやテクスチャをここで一括プリロード -->
    <a-assets>
      <!-- 
        【3Dモデルの差し替え手順】
        src属性を、お持ちの3Dモデルファイルパス（.glb または .gltf）に変更してください。
      -->
      <!-- 例：帽子モデル（ここではダミー指定） -->
      <a-asset-item id="hat-model" src=""></a-asset-item>
      
      <!-- 例：メガネモデル（ここではダミー指定） -->
      <a-asset-item id="glasses-model" src=""></a-asset-item>
    </a-assets>

    <!-- カメラ設定（Face Effectsでは自動的にインカメラ／アウトカメラが制御されます） -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 環境光と平行光源の設定（3Dオブジェクトを立体的に見せるための照明） -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" position="0 2 1" intensity="0.6"></a-light>

    <!-- 
      顔メッシュ（フェイスペイント・マスク）
      顔の凹凸に沿った3Dメッシュを生成します。
      material="wireframe: true" で顔認識のポリゴンを確認できます。
      テクスチャ画像を貼る場合は src="#テクスチャID" を追加します。
    -->
    <xrextras-face-mesh
      material="color: #4CC3D9; opacity: 0.3; wireframe: true">
    </xrextras-face-mesh>

    <!-- 
      頭部（頭頂部/額）に追従するアクセサリーアンカー
      point: forehead (額), head (頭部全体), nose (鼻), mouth (口) などを指定可能
    -->
    <xrextras-face-anchor point="forehead">
      <!-- 
        頭の上に表示するアクセサリーオブジェクト（サンプルとして王冠風のコーンと球体を配置）
        ※ GLTFモデルを使用する場合は、下記のように差し替えてください：
        <a-entity gltf-model="#hat-model" scale="0.1 0.1 0.1" position="0 0.25 0"></a-entity>
      -->
      <a-entity id="party-hat" position="0 0.3 0">
        <!-- 円錐型のパーティーハット本体 -->
        <a-cone
          height="0.3"
          radius-bottom="0.15"
          radius-top="0.01"
          color="#FF5722"
          rotation="0 0 0">
        </a-cone>
        <!-- ハット先端の飾り球 -->
        <a-sphere
          position="0 0.16 0"
          radius="0.04"
          color="#FFEB3B">
        </a-sphere>
      </a-entity>
    </xrextras-face-anchor>

    <!-- 
      鼻周り（メガネの位置）に追従するアクセサリーアンカー
    -->
    <xrextras-face-anchor point="nose">
      <!-- 
        メガネのサンプル（標準プリミティブで構成）
        ※ GLTFモデルを使用する場合は下記に差し替え：
        <a-entity gltf-model="#glasses-model" scale="0.05 0.05 0.05"></a-entity>
      -->
      <a-entity id="glasses-group" position="0 0.02 0.05">
        <!-- 左レンズ枠 -->
        <a-torus
          radius="0.04"
          radius-tubular="0.005"
          position="-0.06 0 0"
          color="#212121">
        </a-torus>
        <!-- 右レンズ枠 -->
        <a-torus
          radius="0.04"
          radius-tubular="0.005"
          position="0.06 0 0"
          color="#212121">
        </a-torus>
        <!-- メガネのブリッジ（中央のつなぎ目） -->
        <a-cylinder
          position="0 0 0"
          rotation="0 0 90"
          radius="0.004"
          height="0.04"
          color="#212121">
        </a-cylinder>
      </a-entity>
    </xrextras-face-anchor>

  </a-scene>

  <!-- カメラ権限要求および認識制御スクリプト -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      const startOverlay = document.getElementById('start-overlay');
      const startButton = document.getElementById('start-button');
      const envWarning = document.getElementById('env-warning');
      const instruction = document.querySelector('.ar-instruction');

      // 1. HTTPS / Localhost 環境チェック
      // Webブラウザはセキュリティ上、HTTPS（またはローカルホスト）以外ではカメラ許可ダイアログを出せません
      const isSecure = window.location.protocol === 'https:' || 
                       window.location.hostname === 'localhost' || 
                       window.location.hostname === '127.0.0.1';

      if (!isSecure) {
        envWarning.style.display = 'block';
        envWarning.innerHTML = '【注意】WebARはHTTPS接続が必要です。<br>https:// でアクセスしているかご確認ください。';
      }

      // 2. ボタン押下時に明示的にカメラアクセスを要求
      startButton.addEventListener('click', async () => {
        try {
          // ブラウザのカメラアクセス権限をユーザー操作起点で直接リクエスト
          // これにより許可ダイアログ（プロンプト）が確実にトリガーされます
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const testStream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'user' },
              audio: false
            });
            // 権限取得確認用の一時ストリームを解放（8th Wall本体にカメラ制御を渡すため）
            testStream.getTracks().forEach(track => track.stop());
          }

          // オーバーレイを非表示にする
          startOverlay.style.display = 'none';
          if (instruction) {
            instruction.innerText = '顔をカメラに向けてください';
          }
        } catch (err) {
          console.warn('カメラ許可の直接取得に失敗、またはブロックされました:', err);
          // 既にブラウザ側で拒否されている、あるいはブロックされている場合のエラー案内
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            envWarning.style.display = 'block';
            envWarning.innerHTML = 'カメラへのアクセスが拒否されています。<br>ブラウザのサイト設定から「カメラ」を許可してください。';
          } else {
            // 許可された場合やその他のケースではオーバーレイを閉じて8th Wallの処理を継続
            startOverlay.style.display = 'none';
          }
        }
      });

      // 3. 8th Wall の顔認識が顔を見つけたときのイベント
      scene.addEventListener('xrfacefound', (event) => {
        console.log('顔を認識しました:', event.detail);
        if (instruction) {
          instruction.innerText = '顔を追従中';
          instruction.style.background = 'rgba(76, 175, 80, 0.7)'; // 認識時は緑色に変化
        }
      });

      // 4. 顔がカメラフレームから外れたときのイベント
      scene.addEventListener('xrfacelost', () => {
        console.log('顔を見失いました');
        if (instruction) {
          instruction.innerText = '顔をカメラに向けてください';
          instruction.style.background = 'rgba(0, 0, 0, 0.7)';
        }
      });

      // 5. 8th Wallのカメラ準備完了イベント
      scene.addEventListener('realityready', () => {
        console.log('8th Wall Reality Ready: カメラが正常に起動しました');
        if (startOverlay.style.display !== 'none') {
          startOverlay.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
