<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall WebAR - 顔認識（Face Effects）</title>

  <!-- A-Frame 本体の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- 8th Wall 最新オープンソースエンジン（顔認識モジュールを指定プリロード） -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine@0.1.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="face: https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr-face.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    /* 読み込み中・顔検出案内用のUIオーバーレイ */
    #overlay-ui {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
      text-align: center;
    }
  </style>

  <script>
    // 顔認識イベントを監視し、3Dモデルの位置・回転を顔に追従させるカスタムコンポーネント
    AFRAME.registerComponent('face-tracker', {
      init: function () {
        const el = this.el;
        const statusText = document.getElementById('status-text');

        // 初期状態は非表示
        el.setAttribute('visible', 'false');

        // 顔を検出したときの処理
        window.addEventListener('xrfacefound', (detail) => {
          el.setAttribute('visible', 'true');
          if (statusText) {
            statusText.textContent = '顔を追従中';
          }
        });

        // 顔の位置や向きが更新されたときの処理
        window.addEventListener('xrfaceupdated', (event) => {
          const detail = event.detail;
          if (!detail || !detail.transform) return;

          const { position, rotation, scale } = detail.transform;

          // 位置の更新
          el.object3D.position.set(position.x, position.y, position.z);

          // クォータニオンによる回転の更新
          el.object3D.quaternion.set(rotation.x, rotation.y, rotation.z, rotation.w);

          // スケールの更新（単一スカラー値の場合に対応）
          if (typeof scale === 'number') {
            el.object3D.scale.set(scale, scale, scale);
          } else if (scale) {
            el.object3D.scale.set(scale.x, scale.y, scale.z);
          }
        });

        // 顔を見失ったときの処理
        window.addEventListener('xrfacelost', () => {
          el.setAttribute('visible', 'false');
          if (statusText) {
            statusText.textContent = 'カメラに顔を向けてください';
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- 案内用UI -->
  <div id="overlay-ui">
    <span id="status-text">カメラを起動中... 顔を画面に向けてください</span>
  </div>

  <!-- A-Frame シーン（8th Wallの顔認識コンポーネント xrface を指定） -->
  <a-scene
    xrface
    embedded
    renderer="colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false">

    <!-- アセット管理 -->
    <a-assets>
      <!-- 要件で指定された3Dモデルファイル -->
      <a-asset-item id="faceModel" src="model.glb"></a-asset-item>
    </a-assets>

    <!-- シーン用ライティング -->
    <a-entity light="type: ambient; intensity: 1.2;"></a-entity>
    <a-entity light="type: directional; intensity: 1.0; position: 0 4 2;"></a-entity>

    <!-- カメラエンティティ -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 顔の動きに追従するエンティティ -->
    <a-entity face-tracker>
      <!-- model.glb の読み込み -->
      <a-entity
        gltf-model="#faceModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1">
      </a-entity>

      <!-- model.glb が同ディレクトリに無い場合でも動作確認できる視覚オブジェクト（王冠風アクセサリ） -->
      <a-cone
        position="0 0.85 0"
        radius-bottom="0.25"
        radius-top="0.4"
        height="0.3"
        material="color: #FFD700; metalness: 0.8; roughness: 0.2;"
        opacity="0.9">
      </a-cone>
      <a-sphere
        position="0 1.1 0"
        radius="0.08"
        material="color: #FF4500;">
      </a-sphere>
    </a-entity>

  </a-scene>

</body>
</html>
