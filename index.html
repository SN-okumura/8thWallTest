<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- スマートフォンの画面回転やレスポンシブ表示に完全追従させるメタタグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>8th Wall WebAR - Face Tracking</title>

  <!-- 1. A-Frame本体（8th Wall互換の8frame）の読み込み -->
  <script src="//cdn.8thwall.com/web/aframe/8frame-1.4.1.min.js"></script>

  <!-- 2. 8th Wallの拡張機能（UIやユーティリティ）の読み込み -->
  <script src="//cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 3. 8th Wall WebAR エンジン本体の読み込み（アプリキーが必要な場合はappKeyパラメータに指定） -->
  <script src="//apps.8thwall.com/xrweb?appKey="></script>

  <style>
    /* 全画面表示用のスタイル定義 */
    body {
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!--
    a-sceneの設定:
    - xrface: 8th Wallの顔認識（Face Effects）を有効化
    - xrextras-loading: カメラ起動中のローディング画面を表示
    - xrextras-runtime-error: エラー時のメッセージ表示
  -->
  <a-scene
    xrface
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true;">

    <!-- ==============================================
         アセットマネージャー
         3Dモデルやテクスチャをここで一括管理します。
         初心者はここを書き換えることで簡単にモデルの差し替えが可能です。
         ============================================== -->
    <a-assets>
      <!-- 顔の表面に適用するマスク用テクスチャ（差し替え可能） -->
      <img id="face-texture" src="https://cdn.8thwall.com/web/assets/face/face-mesh.png" crossorigin="anonymous">

      <!--
        独自の3Dモデル（.glb / .gltf）を使用する場合は以下のように追加してください:
        <a-asset-item id="myGlasses" src="assets/glasses.glb"></a-asset-item>
        <a-asset-item id="myHat" src="assets/hat.glb"></a-asset-item>
      -->
    </a-assets>

    <!-- カメラの設定 -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 環境光と平行光源の設定（3Dオブジェクトをきれいに照らします） -->
    <a-entity light="type: ambient; intensity: 0.8;"></a-entity>
    <a-entity light="type: directional; position: 0 1 1; intensity: 0.6;"></a-entity>

    <!-- ==============================================
         顔メッシュ（フェイスマスク）
         顔の表面にフィットする3Dメッシュを描画します。
         ============================================== -->
    <xrextras-face-mesh
      material="src: #face-texture; transparent: true; opacity: 0.6;">
    </xrextras-face-mesh>

    <!-- ==============================================
         顔の各部位への追従オブジェクト（アクセサリー類）
         point属性で指定した部位に自動的に固定・追従します。
         利用可能な代表的ポイント:
         - forehead (額)
         - noseBridge (鼻筋)
         - noseTip (鼻先)
         - mouth (口)
         - leftEye / rightEye (左目 / 右目)
         - leftEar / rightEar (左耳 / 右耳)
         ============================================== -->

    <!-- 1. 額（forehead）に追従するオブジェクト（例: 帽子や角、アクセサリ） -->
    <xrextras-face-anchor point="forehead">
      <!-- 例として王冠風のゴールドコーンを配置 -->
      <a-cone
        position="0 0.12 0"
        rotation="0 0 0"
        radius-bottom="0.08"
        radius-top="0.0"
        height="0.15"
        material="color: #FFD700; metalness: 0.8; roughness: 0.2;">
      </a-cone>
      <!-- 外部3Dモデルを配置する場合の例:
      <a-entity
        gltf-model="#myHat"
        position="0 0.1 0"
        scale="1 1 1">
      </a-entity>
      -->
    </xrextras-face-anchor>

    <!-- 2. 鼻筋（noseBridge）に追従するオブジェクト（例: メガネやサングラス） -->
    <xrextras-face-anchor point="noseBridge">
      <!-- メガネ風のサンプルプリミティブグループ -->
      <a-entity position="0 0 0.02">
        <!-- 左レンズフレーム -->
        <a-torus position="-0.035 0 0" radius="0.025" radius-tubular="0.002" material="color: #222222;"></a-torus>
        <!-- 右レンズフレーム -->
        <a-torus position="0.035 0 0" radius="0.025" radius-tubular="0.002" material="color: #222222;"></a-torus>
        <!-- ブリッジ（鼻掛け） -->
        <a-cylinder position="0 0 0" rotation="0 0 90" radius="0.002" height="0.02" material="color: #222222;"></a-cylinder>
      </a-entity>
      <!-- 外部3Dメガネモデルを配置する場合の例:
      <a-entity
        gltf-model="#myGlasses"
        position="0 0 0"
        scale="0.05 0.05 0.05">
      </a-entity>
      -->
    </xrextras-face-anchor>

    <!-- 3. 鼻先（noseTip）に追従するオブジェクト（例: ピエロの鼻） -->
    <xrextras-face-anchor point="noseTip">
      <a-sphere
        position="0 0 0.01"
        radius="0.02"
        material="color: #FF0055; roughness: 0.3;">
      </a-sphere>
    </xrextras-face-anchor>

    <!-- 4. 頭部全体（head）に連動するアンカー（顔の傾きや位置全体に同期） -->
    <xrextras-face-anchor>
      <!-- 頭の周囲をふわふわ浮遊するエフェクトの例 -->
      <a-torus
        position="0 0.3 0"
        rotation="70 0 0"
        radius="0.2"
        radius-tubular="0.008"
        material="color: #00FFFF; emissive: #008888; roughness: 0.5;">
      </a-torus>
    </xrextras-face-anchor>

  </a-scene>

</body>
</html>
